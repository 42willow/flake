name: Validate Nix Flake
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**.nix"
      - "**.lock"
      - ".github/workflows/check.yml"

permissions: {}

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alejandra
            run: nix run nixpkgs#alejandra -- --check .
          - name: statix
            run: nix run nixpkgs#statix -- check .
          - name: deadnix
            run: nix run nixpkgs#deadnix -- -eq .
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Mic92/hestia/action@v1
        with:
          version: v1

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}

  check-flake:
    name: ${{ matrix.host }} (${{ matrix.system }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            target_attr: nixosConfigurations
            host: earthy
          - os: ubuntu-24.04-arm
            system: aarch64-linux
            target_attr: nixosConfigurations
            host: anemone
          - os: ubuntu-latest
            system: x86_64-linux
            target_attr: nixosConfigurations
            host: lily
          - os: ubuntu-latest
            system: x86_64-linux
            target_attr: nixosConfigurations
            host: zinnia
          - os: macos-latest
            system: aarch64-darwin
            target_attr: darwinConfigurations
            host: starling

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Mic92/hestia/action@v1
        with:
          version: v1

      - name: Validate Host
        run: |
          nix eval .#${{ matrix.target_attr }}.${{ matrix.host }}.config.system.build.toplevel.drvPath --show-trace
