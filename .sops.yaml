keys:
  - &willow 
  - &earthy 
  - &starling 
creation_rules:
  - path_regex: secrets/willow\.yaml$
    key_groups:
      - age:
          - *willow
  - path_regex: secrets/services/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *willow
          - *earthy
          - *starling
